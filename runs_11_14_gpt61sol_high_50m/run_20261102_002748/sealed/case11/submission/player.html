<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>双头注意力课程 · 无障碍播放器</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:17px/1.6 system-ui,"Microsoft YaHei",sans-serif;background:#101b2b;color:#edf3fc;max-width:1120px;margin:24px auto;padding:0 20px}h1{font-size:1.6rem;margin-bottom:6px}p{margin-top:6px}.hint{color:#bcd0e8}video{width:100%;display:block;background:#000;margin-top:16px}button,select,input{font:inherit}button,select{padding:8px 14px;background:#233c5b;color:inherit;border:1px solid #7898bc;border-radius:5px;margin:7px 8px 7px 0}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ffce71;outline-offset:3px}label{display:inline-block;margin-right:16px}.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}#caption{background:#1c304b;border-left:4px solid #ffce71;padding:12px;min-height:3.5em;margin:12px 0}#status{white-space:pre-wrap;color:#bcd0e8}input[type=range]{width:140px}small{font-size:.85em}
</style>
<h1>双头注意力：稳定身份、局部参与与融合</h1>
<p class="hint">选择完整的提交文件夹后播放。描述可随时开关，章节导航与定格使用同一条时间轴。</p>
<label>打开课程文件夹 <input id="folder" type="file" webkitdirectory multiple></label>
<video id="video" controls muted playsinline preload="metadata" aria-label="双头注意力课程画面"></video>
<audio id="base" preload="auto"></audio><audio id="ad" preload="auto"></audio>
<div class="bar"><button id="play" disabled>播放</button><label><input id="enabled" type="checkbox" checked> 口述描述</label><label><input id="captions" type="checkbox"> 显示描述文字</label><label>音量 <input id="volume" type="range" min="0" max="1" step="0.05" value="1"></label></div>
<label>章节 <select id="chapters" disabled><option value="">选择章节</option></select></label>
<div id="caption" hidden aria-label="当前描述文字"></div>
<p id="status" role="status" aria-live="polite">尚未加载课程。</p>
<p class="hint"><small>视频内置混音保持静音；教师与描述由独立音轨播放。关闭描述保留全部定格和教师声音。描述文字显示在画面下方，不遮盖图示。</small></p>
<script>
'use strict';
const $=s=>document.querySelector(s),v=$('#video'),base=$('#base'),ad=$('#ad'),status=$('#status');
let urls=[],cues=[],ready=false,requestId=0;
function forceMute(){if(!v.muted)v.muted=true;} v.addEventListener('volumechange',forceMute);
function sync(force=false){for(const a of [base,ad]){if(force||Math.abs(a.currentTime-v.currentTime)>.08){try{a.currentTime=v.currentTime;}catch(_){}}a.playbackRate=v.playbackRate;}ad.muted=!$('#enabled').checked;forceMute();}
function stopAudio(){base.pause();ad.pause();}
async function playAudio(){if(!ready||v.paused||v.seeking)return;sync();try{await Promise.all([base.play(),ad.play()]);}catch(e){status.textContent='请点击播放以启动音轨：'+e.message;}}
function caption(){const c=cues.find(c=>v.currentTime>=c.start&&v.currentTime<c.end);$('#caption').textContent=c?c.text:'（此刻无口述描述）';}
function tick(){if(ready){sync();caption();}requestId=requestAnimationFrame(tick);}requestId=requestAnimationFrame(tick);
v.addEventListener('play',()=>{$('#play').textContent='暂停';playAudio();});
v.addEventListener('playing',playAudio);
v.addEventListener('pause',()=>{stopAudio();$('#play').textContent='播放';});
v.addEventListener('waiting',stopAudio);
v.addEventListener('seeking',()=>{stopAudio();sync(true);});
v.addEventListener('seeked',()=>{sync(true);playAudio();caption();});
v.addEventListener('ratechange',()=>sync());v.addEventListener('ended',stopAudio);
$('#play').onclick=async()=>{if(v.paused){sync(true);try{await Promise.all([v.play(),base.play(),ad.play()]);}catch(e){status.textContent=e.message;}}else v.pause();};
$('#enabled').onchange=()=>{ad.muted=!$('#enabled').checked;};
$('#captions').onchange=()=>{$('#caption').hidden=!$('#captions').checked;caption();};
$('#volume').oninput=()=>{base.volume=ad.volume=Number($('#volume').value);};
$('#chapters').onchange=()=>{if($('#chapters').value!==''){v.currentTime=Number($('#chapters').value);sync(true);caption();}};
$('#folder').onchange=async e=>{
 try{
  v.pause();stopAudio();ready=false;urls.forEach(URL.revokeObjectURL);urls=[];
  const files=Array.from(e.target.files),get=n=>files.find(f=>f.webkitRelativePath.split('/').slice(1).join('/')===n);
  const read=async n=>{const f=get(n);if(!f)throw Error('缺少文件：'+n);return JSON.parse(await f.text());};
  const cfg=await read('player_config.json');if(cfg.pause_policy!=='fixed_timeline')throw Error('需要固定时间轴配置');
  for(const [element,name]of[[v,cfg.tracks.video],[base,cfg.tracks.base],[ad,cfg.tracks.description]]){const f=get(name);if(!f)throw Error('缺少音视频：'+name);const url=URL.createObjectURL(f);urls.push(url);element.src=url;element.load();}
  cues=(await read('description_plan.json')).cues;
  const chapters=(await read('chapters.json')).chapters,nav=$('#chapters');nav.innerHTML='<option value="">选择章节</option>';
  for(const c of chapters){const o=document.createElement('option');o.value=c.output_time;o.textContent=c.title;nav.appendChild(o);}
  ready=true;sync(true);$('#play').disabled=false;nav.disabled=false;caption();
  status.textContent='已加载：3分18秒，6个章节。描述开关不改变时间轴。';
 }catch(e){ready=false;$('#play').disabled=true;status.textContent='加载失败：'+e.message;}
};
</script></html>
